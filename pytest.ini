[pytest]
testpaths = tests
# Tests print measured numbers rather than just passing silently -- a planner
# test that says "min clearance along the route 3.82 cells" tells you HOW
# comfortably it passed, which is what you want when tuning. -s keeps that
# visible instead of swallowing it.
addopts = -q -s
markers =
    slow: takes more than a second (map database, localiser search)
